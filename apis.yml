name: Smallhold
description: >-
  Smallhold is a specialty organic mushroom company founded in 2017 by Andrew
  Carter and Adam DeMartino and headquartered in Brooklyn, New York. A Certified
  B Corporation, Smallhold grows gourmet mushroom varieties — including blue
  oyster, lion's mane, maitake, royal trumpet, and shiitake — using modular,
  automated "minifarm" growing environments designed for distributed, locally
  grown supply to grocery retailers and restaurants. Its public presence is a
  direct-to-consumer and retail-partner storefront built on Shopify; the company
  publishes no first-party developer API, developer portal, or API documentation.
  This profile was added to the API Evangelist network as a Techstars portfolio
  lead and run through the enrichment pipeline, which confirmed no bespoke API
  surface — only Shopify's platform OAuth discovery documents are exposed on the
  shop domain.
